<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Apartment Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; color: #e8e8e8; font-size: 13px;
    background: rgba(10,12,16,0.6); padding: 10px 14px; border-radius: 8px; line-height: 1.5;
    backdrop-filter: blur(4px);
  }
  #hud b { color: #fff; }
  button {
    background: #2a2f3a; color: #eee; border: 1px solid #444; border-radius: 6px;
    padding: 4px 10px; margin-top: 6px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #3a4150; }
</style>
</head>
<body>
<div id="hud">
  <b>Apartment Simulator</b><br/>
  Orbit: drag · zoom: scroll · pan: right-drag<br/>
  Click the scene to fly: WASD + space (up) + mouse. Esc to exit.<br/>
  <button id="topBtn">Top-down view</button>
  <button id="roofBtn">Show roof</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
